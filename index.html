<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plans">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4f4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151617" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Plans</title>
<style>
:root {
  --bg: #f4f4f1; --card: #ffffff; --text: #1b1c1d; --dim: #63666b; --line: #e1e1dc;
  --now: #1f8f43; --wait: #d93a3f; --live: #2f6fdc; --neutral: #6b7280; --tab: #e7e7e2;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #151617; --card: #212325; --text: #ececea; --dim: #a1a4a8; --line: #313437;
    --now: #3fbf68; --wait: #f0656a; --live: #6aa1ff; --neutral: #8b919a; --tab: #2b2e31;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  overflow-x: hidden; overflow-wrap: anywhere;
}
header {
  position: sticky; top: 0; z-index: 2; background: var(--bg);
  padding: calc(env(safe-area-inset-top) + 10px) max(16px, env(safe-area-inset-right)) 8px max(16px, env(safe-area-inset-left));
  border-bottom: 1px solid var(--line);
}
.tabs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 0; border-radius: 999px; padding: 6px 13px; font: inherit; font-weight: 600;
  background: var(--tab); color: var(--text); cursor: pointer; display: flex; align-items: center; gap: 7px;
}
.tab[aria-selected="true"] { background: var(--text); color: var(--bg); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--neutral); opacity: .5; }
.dot.fresh { background: var(--now); opacity: 1; }
.status { margin-top: 5px; font-size: 12.5px; color: var(--dim); }
.status.warn { color: var(--wait); }
main {
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px;
  padding: 12px max(16px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 28px) max(16px, env(safe-area-inset-left));
}
#chat, #plan { width: 100%; max-width: 760px; justify-self: center; }
.send { display: flex; gap: 8px; align-items: flex-end; }
.send textarea {
  flex: 1; min-width: 0; font: inherit; padding: 7px 11px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--card); color: var(--text); resize: none; max-height: 40vh; display: block;
}
.btn { font: inherit; font-weight: 600; padding: 7px 15px; border-radius: 10px; border: 0; background: var(--text); color: var(--bg); cursor: pointer; }
.btn:disabled { opacity: .5; }
.btn.ghost { background: var(--tab); color: var(--text); }
.chatnote { display: flex; justify-content: space-between; gap: 10px; margin: 4px 2px 0; font-size: 12.5px; color: var(--dim); }
.chatnote.warn #chatmsg { color: var(--wait); }
.link { background: none; border: 0; padding: 0; font: inherit; color: var(--dim); text-decoration: underline; cursor: pointer; }
#settings { margin-top: 6px; padding: 10px 12px; background: var(--card); border-radius: 10px; font-size: 13.5px; color: var(--dim); }
#settings input { width: 100%; margin: 8px 0; font: inherit; padding: 7px 11px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
#thread { list-style: none; margin: 6px 2px 0; padding: 0; font-size: 13.5px; }
#thread:empty { display: none; }
#thread li { margin-top: 4px; white-space: pre-wrap; }
.t { color: var(--dim); font-variant-numeric: tabular-nums; margin-right: 6px; }
.st { color: var(--dim); font-size: 12px; }
.st.replied { color: var(--now); }
.rep { margin: 2px 0 0 14px; }
.agent-head { display: flex; align-items: baseline; gap: 8px; margin: 2px 2px 10px; }
.agent-head h1 { font-size: 18px; margin: 0; text-transform: capitalize; }
.agent-head span { color: var(--dim); font-size: 13px; }
.card {
  background: var(--card); border-radius: 14px; padding: 12px 14px 14px; margin-bottom: 12px;
  border-top: 4px solid var(--c, var(--line));
}
.card h2 { margin: 0 0 4px; font-size: 12.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--c, var(--dim)); }
.item { margin-top: 10px; }
.item:first-of-type { margin-top: 6px; }
.title { font-weight: 650; }
.badge {
  display: inline-block; min-width: 1.6em; padding: 0 .4em; margin-right: 6px; border-radius: 7px; text-align: center;
  background: var(--c, var(--neutral)); color: #fff; font-weight: 700; font-size: 13.5px; line-height: 1.5;
}
.bullet { color: var(--c, var(--dim)); font-weight: 700; margin-right: 6px; }
.eta { font-weight: 600; white-space: nowrap; color: var(--now); }
.eta.over { color: var(--wait); }
.detail { color: var(--dim); font-size: 14.5px; margin-top: 2px; padding-left: 16px; }
.detail b { color: var(--text); font-weight: 600; }
details.card summary { cursor: pointer; list-style: none; }
details.card summary::-webkit-details-marker { display: none; }
details.card summary h2 { display: inline; }
details.card summary::after { content: " ▸"; color: var(--dim); }
details.card[open] summary::after { content: " ▾"; }
.done { color: var(--dim); margin-top: 6px; }
.empty { color: var(--dim); padding: 24px 2px; }
#unlock { padding: 24px 16px; max-width: 520px; }
#unlock input { width: 100%; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
#unlock button { margin-top: 10px; font: inherit; font-weight: 600; padding: 9px 18px; border-radius: 10px; border: 0; background: var(--text); color: var(--bg); }
</style>
</head>
<body>
<header hidden><nav class="tabs" role="tablist"></nav><div class="status"></div></header>
<main>
  <section id="chat" hidden>
    <form class="send" id="sendform" autocomplete="off">
      <textarea id="msg" rows="1" maxlength="4000" placeholder="Message"></textarea>
      <button class="btn" id="sendbtn">Send</button>
    </form>
    <div class="chatnote"><span id="chatmsg"></span><button type="button" class="link" id="setbtn">settings</button></div>
    <div id="settings" hidden>
      Send key: a GitHub fine-grained token for this one repo (Contents: read and write). It stays in this browser only.
      <input id="tokin" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="github_pat_…">
      <button type="button" class="btn" id="toksave">Save</button> <button type="button" class="btn ghost" id="tokdel">Remove</button>
      <div id="tokmsg" class="status"></div>
    </div>
    <ol id="thread"></ol>
  </section>
  <div id="plan"></div>
</main>
<section id="unlock" hidden>
  <p>Paste your Plans link (or its key) once.</p>
  <input id="keyin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://…#k=…">
  <button id="keybtn">Open</button>
  <p id="keymsg" class="status"></p>
</section>
<script>
'use strict'
const TZ = 'Australia/Brisbane', BNE = 10 * 3600e3 // Brisbane is UTC+10, no daylight saving
const LS = { get: k => { try { return localStorage.getItem(k) } catch { return null } }, set: (k, v) => { try { localStorage.setItem(k, v) } catch {} }, del: k => { try { localStorage.removeItem(k) } catch {} } }
const $ = s => document.querySelector(s)
let key = null, data = null, docs = new Map(), checked = 0, offline = false, sel = LS.get('plans-sel') || 'max'

// ---- parsing: same rules as the desktop Plan pane (plan/hooks/parse.ts) ----
function parsePlan(name, text, updatedMs) {
  const sections = []; let cur = null
  for (const raw of text.split('\n')) {
    const line = raw.trimEnd()
    const h = /^##\s+(.*)$/.exec(line)
    if (h) { cur = { title: h[1].trim(), items: [] }; sections.push(cur); continue }
    const last = cur && cur.items[cur.items.length - 1]
    if (last && /^\s{2,}\S/.test(line) && !/^\s*[-*]\s+\[[ xX]\]/.test(line)) {
      const eta = /^\s*ETA:\s*(\d{1,2}:\d{2})\b/i.exec(line)
      if (eta) { last.eta = eta[1]; continue }
      last.detail.push(line.trim().replace(/^[-*]\s+/, ''))
      continue
    }
    const it = /^(?:[-*]|(\d+|[a-z])\.)\s+(.*)$/.exec(line)
    const body = it ? it[2].replace(/^\[[ xX]\]\s*/, '').trim() : undefined
    const n = (it && it[1]) || (/^(\d+|[a-z])\.\s+/.exec(body || '') || [])[1]
    const t = n && !(it && it[1]) ? body.replace(/^(?:\d+|[a-z])\.\s+/, '') : body
    if (t && cur && !/^\(nothing/i.test(t)) cur.items.push({ text: t, detail: [], ...(n ? { num: n } : {}) })
  }
  return { name, updatedMs, sections: sections.filter(s => s.items.length) }
}
const isDone = t => /^(done|ticked)/i.test(t)
const secColor = t => /^now/i.test(t) ? 'var(--now)' : /^waiting/i.test(t) ? 'var(--wait)' : /^live/i.test(t) ? 'var(--live)' : ''
// Minutes until today's "HH:MM" in Brisbane, whatever zone the phone is in.
function etaLeft(hhmm, now) {
  const [h, m] = hhmm.split(':').map(Number)
  const b = new Date(now + BNE)
  const at = Date.UTC(b.getUTCFullYear(), b.getUTCMonth(), b.getUTCDate(), h, m) - BNE
  const min = Math.round((at - now) / 60000)
  if (min < -720) return ''
  if (min <= 0) return 'overdue'
  return min < 60 ? `~${min}m left` : `~${Math.floor(min / 60)}h ${min % 60}m left`
}
function ago(ms, now) {
  const sec = Math.max(0, Math.round((now - ms) / 1000))
  if (sec < 60) return `${sec}s`
  const m = Math.round(sec / 60)
  return m < 60 ? `${m} min` : `${Math.round(m / 60)} h`
}
const day = ms => new Intl.DateTimeFormat('en-AU', { timeZone: TZ, day: 'numeric', month: 'short' }).format(ms)
const when = ms => day(ms) === day(Date.now()) ? hm(ms) : `${day(ms)} ${hm(ms)}`
const hm = ms => new Intl.DateTimeFormat('en-AU', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(ms)
const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>')

// ---- key + decryption ----
function keyFrom(s) {
  const m = /(?:^|[#&?])k=([A-Za-z0-9_-]{43})/.exec(s) || /^\s*([A-Za-z0-9_-]{43})\s*$/.exec(s)
  return m ? m[1] : null
}
const b64u = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '='), c => c.charCodeAt(0))
async function decrypt(buf, k) {
  const ck = await crypto.subtle.importKey('raw', b64u(k), 'AES-GCM', false, ['decrypt'])
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, ck, buf.slice(12))
  return JSON.parse(new TextDecoder().decode(plain))
}
async function encrypt(obj, k) {
  const ck = await crypto.subtle.importKey('raw', b64u(k), 'AES-GCM', false, ['encrypt'])
  const iv = crypto.getRandomValues(new Uint8Array(12))
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, ck, new TextEncoder().encode(JSON.stringify(obj))))
  const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12)
  return out
}
async function fetchBlob(path) {
  const r = await fetch(`${path}?t=${Date.now()}`, { cache: 'no-store' })
  if (!r.ok) throw new Error(`HTTP ${r.status}`)
  return { buf: new Uint8Array(await r.arrayBuffer()), cached: r.headers.get('x-plans-cache') === '1' }
}
// plans/index.enc lists every agent (from any machine); each plan is its own plans/<id>.enc, fetched
// only when its content mark (h) changed. A new agent appears as soon as its file is in the index.
async function load() {
  const idx = await fetchBlob('plans/index.enc')
  const index = await decrypt(idx.buf, key)
  let cached = idx.cached
  const next = new Map()
  await Promise.all(index.agents.map(async e => {
    const have = docs.get(e.id)
    if (have && have.h === e.h) { next.set(e.id, have); return }
    try {
      const r = await fetchBlob(`plans/${e.id}.enc`)
      cached = cached || r.cached
      next.set(e.id, { ...(await decrypt(r.buf, key)), h: e.h })
    } catch (err) { if (have) next.set(e.id, have); else throw err }
  }))
  docs = next
  return { synced: index.synced, agents: [...docs].map(([id, d]) => ({ id, name: d.name, mtimeMs: d.updatedMs, text: d.text })), cached }
}

let busy = false
async function refresh() {
  if (!key || busy) return
  busy = true
  try {
    const got = await load()
    data = got; const cached = got.cached
    offline = cached; if (!cached) checked = Date.now()
    render()
    pullThread()
  } catch (e) {
    if (e && e.name === 'OperationError') { showUnlock('That key does not open these plans.'); return }
    offline = true; render()
  } finally { busy = false }
}

function showUnlock(msg) {
  $('header').hidden = true; $('main').hidden = true; $('#unlock').hidden = false
  $('#keymsg').textContent = msg || ''
}
$('#keybtn').onclick = async () => {
  const k = keyFrom($('#keyin').value)
  if (!k) { $('#keymsg').textContent = 'No key found in that.'; return }
  key = k; LS.set('plans-key', k); history.replaceState(null, '', `#k=${k}`)
  $('#unlock').hidden = true; $('main').hidden = false; refresh()
}

// ---- render ----
function agentsSorted() {
  if (!data) return []
  // Max first, then everyone else alphabetically.
  const rank = n => n.toLowerCase() === 'max' ? 0 : 1
  return data.agents.map(a => ({ ...parsePlan(a.name, a.text, a.mtimeMs), id: a.id }))
    .sort((a, b) => rank(a.name) - rank(b.name) || a.name.localeCompare(b.name, 'en', { sensitivity: 'base' }))
}

function itemHtml(t, title, now) {
  const c = secColor(title)
  const mark = t.num ? `<span class="badge">${esc(t.num)}</span>` : `<span class="bullet">•</span>`
  const left = t.eta ? etaLeft(t.eta, now) : ''
  const eta = left ? ` <span class="eta${left === 'overdue' ? ' over' : ''}">· ETA ${esc(t.eta)} (${left})</span>` : ''
  const det = t.detail.map(d => `<div class="detail">${fmt(d).replace(/^([A-Z][A-Za-z ]{0,18}:)/, '<b>$1</b>')}</div>`).join('')
  return `<div class="item"><div class="title">${mark}${fmt(t.text)}${eta}</div>${det}</div>`
}
function planHtml(a, now) {
  const open = a.sections.filter(s => !isDone(s.title)), done = a.sections.filter(s => isDone(s.title))
  let h = `<div class="agent-head"><h1>${esc(a.name)}</h1><span>updated ${ago(a.updatedMs, now)} ago</span></div>`
  for (const s of open) {
    const c = secColor(s.title)
    h += `<section class="card" style="${c ? `--c:${c}` : ''}"><h2>${esc(s.title)}</h2>${s.items.map(t => itemHtml(t, s.title, now)).join('')}</section>`
  }
  for (const s of done) {
    h += `<details class="card"><summary><h2>${esc(s.title)} · ${s.items.length}</h2></summary>${s.items.map(t => `<div class="done">✓ ${fmt(t.text)}</div>`).join('')}</details>`
  }
  if (!a.sections.length) h += `<div class="empty">Nothing on this list.</div>`
  return `<article>${h}</article>`
}

function render() {
  if (!data) return
  const now = Date.now(), list = agentsSorted()
  if (!list.length) { $('#chat').hidden = true; $('#plan').innerHTML = '<div class="empty">No plans yet.</div>'; return }
  let i = list.findIndex(a => a.name.toLowerCase() === sel.toLowerCase()); if (i < 0) i = 0
  const shown = [list[i]] // only the selected agent, at every width (Peter, 7 Oct)
  // Keep <details> open/closed across re-renders.
  const openDone = new Set([...document.querySelectorAll('details.card[open]')].map(d => d.closest('article')?.querySelector('h1')?.textContent))
  $('header').hidden = false
  $('.tabs').innerHTML = list.map(a => `<button class="tab" role="tab" data-n="${esc(a.name)}" aria-selected="${shown.includes(a)}"><span class="dot${now - a.updatedMs < 5 * 60e3 ? ' fresh' : ''}"></span>${esc(a.name[0].toUpperCase() + a.name.slice(1))}</button>`).join('')
  const st = $('.status')
  st.textContent = `last synced ${hm(data.synced)}` + (offline ? ' · offline, showing the last copy' : checked ? ` · checked ${hm(checked)}` : '')
  st.classList.toggle('warn', offline)
  const m = $('#plan')
  m.innerHTML = shown.map(a => planHtml(a, now)).join('')
  renderChat()
  m.querySelectorAll('article').forEach(art => { if (openDone.has(art.querySelector('h1').textContent)) art.querySelector('details')?.setAttribute('open', '') })
}
$('.tabs').addEventListener('click', e => {
  const b = e.target.closest('.tab'); if (!b) return
  sel = b.dataset.n; LS.set('plans-sel', sel); render(); scrollTo(0, 0); pullThread()
})
function step(d) {
  const list = agentsSorted(); if (list.length < 2) return
  let i = list.findIndex(a => a.name.toLowerCase() === sel.toLowerCase()); if (i < 0) i = 0
  sel = list[(i + d + list.length) % list.length].name; LS.set('plans-sel', sel); render(); scrollTo(0, 0); pullThread()
}
let tx = 0, ty = 0
document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY }, { passive: true })
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty
  if (e.target.closest && e.target.closest('#chat')) return // swiping inside the message box is not a tab change
  if (Math.abs(dx) > 70 && Math.abs(dx) > 1.6 * Math.abs(dy) && !(e.target.closest && e.target.closest('.tabs'))) step(dx < 0 ? 1 : -1)
}, { passive: true })

// ---- messages to the open agent ----
// The phone writes inbox/<agent id>/<msg id>.enc (encrypted with the plans key) through the GitHub contents API,
// using a send key (fine-grained token, this repo only) kept in this browser's localStorage. The Mac pulls it
// into that agent's inbox log, deletes it, and records it in replies/<agent id>.enc, which also carries replies.
const GH = 'albatross310/6p2z6q6gsz', API = `https://api.github.com/repos/${GH}/`
const tok = () => LS.get('plans-gh-token')
const cap = s => s[0].toUpperCase() + s.slice(1)
const threads = new Map(), drafts = new Map()
let chatFor = null, sending = false
const sentList = () => { try { return JSON.parse(LS.get('plans-sent') || '[]') } catch { return [] } }
const saveSent = a => LS.set('plans-sent', JSON.stringify(a.slice(-60)))
const b64 = u8 => { let s = ''; for (const c of u8) s += String.fromCharCode(c); return btoa(s) }
const gh = (path, opt = {}, t = tok()) => fetch(API + path, {
  cache: 'no-store', ...opt,
  headers: { Authorization: `Bearer ${t}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(opt.headers || {}) },
})
function current() {
  const list = agentsSorted()
  return list.find(a => a.name.toLowerCase() === sel.toLowerCase()) || list[0]
}
function note(text, warn) { $('#chatmsg').textContent = text || ''; $('.chatnote').classList.toggle('warn', !!warn) }

async function sendMessage(a, text) {
  const sentMs = Date.now()
  const id = `${sentMs}-${[...crypto.getRandomValues(new Uint8Array(3))].map(b => b.toString(16).padStart(2, '0')).join('')}`
  const body = await encrypt({ v: 1, id, name: a.name, text, sentMs }, key)
  let r
  try { r = await gh(`contents/inbox/${a.id}/${id}.enc`, { method: 'PUT', body: JSON.stringify({ message: 'inbox', content: b64(body) }) }) }
  catch { throw new Error('Not sent: no connection?') }
  if (r.status === 401) throw new Error('Not sent: GitHub rejected the send key (settings).')
  if (r.status === 403 || r.status === 404) throw new Error('Not sent: the send key cannot write to this repo (settings).')
  if (!r.ok) throw new Error(`Not sent: GitHub said ${r.status}.`)
  return { id, aid: a.id, text, sentMs }
}
// replies/<id>.enc: straight from the API when there is a send key (no Pages delay), else from the site.
async function pullThread() {
  const a = data && current(); if (!a || !key) return
  try {
    let buf = null, done = false
    if (tok()) try {
      const r = await gh(`contents/replies/${a.id}.enc?ref=main`, { headers: { Accept: 'application/vnd.github.raw' } })
      if (r.ok) { buf = new Uint8Array(await r.arrayBuffer()); done = true } else if (r.status === 404) done = true
    } catch {}
    if (!done) {
      const r = await fetch(`replies/${a.id}.enc?t=${Date.now()}`, { cache: 'no-store' })
      if (r.ok) buf = new Uint8Array(await r.arrayBuffer()); else if (r.status !== 404) throw new Error(`HTTP ${r.status}`)
    }
    const th = buf ? await decrypt(buf, key) : { msgs: [], replies: [] }
    threads.set(a.id, th)
    // Once the Mac has it, the thread is the record; drop the local copy.
    saveSent(sentList().filter(m => !(m.aid === a.id && th.msgs.some(x => x.id === m.id))))
  } catch { /* keep the last thread we had */ }
  renderChat()
}
function renderChat() {
  const a = data && current(); if (!a) return
  $('#chat').hidden = false
  const ta = $('#msg')
  if (chatFor !== a.id) { chatFor = a.id; ta.value = drafts.get(a.id) || ''; grow(); if (!sending) note('') }
  ta.placeholder = tok() ? `Message ${cap(a.name)}` : 'Add a send key (settings)'
  if (!tok() && !$('#chatmsg').textContent) note('Add a send key (settings)')
  if (tok() && $('#chatmsg').textContent === 'Add a send key (settings)') note('')
  const th = threads.get(a.id) || { msgs: [], replies: [] }
  const byId = new Map()
  for (const m of sentList()) if (m.aid === a.id) byId.set(m.id, { ...m, st: 'sent' })
  for (const m of th.msgs) byId.set(m.id, { ...m, st: 'delivered' })
  const msgs = [...byId.values()].sort((x, y) => x.sentMs - y.sentMs).slice(-5)
  $('#thread').innerHTML = msgs.map(m => {
    const rs = (th.replies || []).filter(r => r.id === m.id)
    const st = rs.length ? 'replied' : m.st
    return `<li><span class="t">${when(m.sentMs)}</span>${esc(m.text)} <span class="st ${st}">· ${st}</span>` +
      rs.map(r => `<div class="rep"><span class="t">${when(r.atMs)}</span><b>${esc(cap(a.name))}:</b> ${esc(r.text)}</div>`).join('') + '</li>'
  }).join('')
}
function grow() { const ta = $('#msg'); ta.style.height = 'auto'; if (ta.value) ta.style.height = ta.scrollHeight + 2 + 'px' }
$('#msg').addEventListener('input', () => { if (chatFor) drafts.set(chatFor, $('#msg').value); grow() })
$('#msg').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); $('#sendform').requestSubmit() } })
$('#sendform').addEventListener('submit', async e => {
  e.preventDefault()
  if (!tok()) { openSettings(); return }
  const a = current(), text = $('#msg').value.trim()
  if (!a || !text || sending) return
  sending = true; $('#sendbtn').disabled = true; note('Sending…')
  try {
    saveSent([...sentList(), await sendMessage(a, text)])
    drafts.delete(a.id); if (chatFor === a.id) { $('#msg').value = ''; grow() }
    note('')
  } catch (err) { note(err.message, true) }
  finally { sending = false; $('#sendbtn').disabled = false; renderChat() }
})
function openSettings() {
  $('#settings').hidden = false
  $('#tokmsg').textContent = tok() ? 'A send key is saved in this browser.' : 'No send key yet.'
  $('#tokin').focus()
}
$('#setbtn').onclick = () => { if ($('#settings').hidden) openSettings(); else $('#settings').hidden = true }
$('#toksave').onclick = async () => {
  const v = $('#tokin').value.trim(), msg = $('#tokmsg')
  if (!v) { msg.textContent = 'Paste the token first.'; return }
  msg.textContent = 'Checking…'
  let say = 'Saved in this browser only.'
  try {
    const r = await gh('', {}, v)
    if (r.status === 401) { msg.textContent = 'GitHub rejected that token. Not saved.'; return }
    if (!r.ok) say = `Saved, but GitHub said ${r.status} for this repo; check the token's repository access.`
  } catch { say = 'Saved (could not reach GitHub to check it).' }
  LS.set('plans-gh-token', v); $('#tokin').value = ''; msg.textContent = say
  note(''); renderChat(); pullThread()
}
$('#tokdel').onclick = () => { LS.del('plans-gh-token'); $('#tokmsg').textContent = 'Removed from this browser.'; note(''); renderChat() }

// ---- start ----
key = keyFrom(location.hash) || LS.get('plans-key')
if (key) {
  LS.set('plans-key', key)
  // Keep the key in the address so Safari's "Add to Home Screen" carries it into the installed app.
  if (keyFrom(location.hash) !== key) history.replaceState(null, '', `#k=${key}`)
  refresh()
} else showUnlock()
setInterval(() => { if (document.visibilityState === 'visible') refresh() }, 30e3)
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh() })
addEventListener('focus', refresh)
addEventListener('pageshow', refresh)
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {})
</script>
</body>
